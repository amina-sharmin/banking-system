    <rect x="27" y="58" width="10" height="24" rx="2" fill="#d4af37"/>
    <rect x="45" y="46" width="10" height="36" rx="2" fill="#f5e7b8"/>
    <rect x="63" y="34" width="10" height="48" rx="2" fill="#d4af37"/>
  </g>

  <!-- Wordmark, centered below icon -->
  <text text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">
    <tspan x="150" y="150" fill="#0f2557">Secure</tspan><tspan fill="#b8860b">Bank</tspan>
  </text>
  <text x="150" y="175" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5a6b7d" letter-spacing="2">TRUSTED DIGITAL BANKING</text>
</svg>
