<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SecureBank</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>

  <div class="container">
    <h1>Create Account</h1>
    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label for="regName">Full Name</label>
        <input type="text" id="regName" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label for="regEmail">Email Address</label>
        <input type="email" id="regEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" placeholder="At least 4 characters" required>
      </div>
      <div class="form-group">
        <label for="regConfirmPassword">Confirm Password</label>
        <input type="password" id="regConfirmPassword" placeholder="Re-enter password" required>
      </div>
      <div class="form-group">
        <label for="regInitialDeposit">Initial Deposit ($)</label>
        <input type="number" id="regInitialDeposit" placeholder="0" min="0" step="0.01" value="0" required>
      </div>
      <div id="regError" class="error-text"></div>
      <button type="submit">Create Account</button>
    </form>
    <div class="form-footer">
      Already have an account? <a href="index.html">Login here</a>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
