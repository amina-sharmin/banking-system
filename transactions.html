<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transactions - SecureBank</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>

  <nav class="navbar">
    <!-- was: <div class="logo">SecureBank</div> -->
    <div class="logo"><img src="assets/logo.svg" alt="SecureBank" style="height: 32px;"></div>
    <div class="nav-links">
      <a href="dashboard.html">Dashboard</a>
      <a href="transactions.html">Transactions</a>
      <a href="history.html">History</a>
      <button class="btn-logout" onclick="handleLogout()">Logout</button>
    </div>
  </nav>

  <div class="dashboard-container" style="max-width: 500px;">
    <h1>Manage Funds</h1>

    <div class="current-balance-note">
      Current Balance: <strong id="currentBalance">$0.00</strong>
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('deposit')">Deposit</button>
      <button class="tab-btn" onclick="switchTab('withdraw')">Withdraw</button>
      <button class="tab-btn" onclick="switchTab('transfer')">Transfer</button>
    </div>

    <!-- DEPOSIT -->
    <div class="tab-content active card" id="tab-deposit">
      <h2>Deposit Money</h2>
      <form onsubmit="handleDeposit(event)">
        <div class="form-group">
          <label for="depositAmount">Amount ($)</label>
          <input type="number" id="depositAmount" min="0.01" step="0.01" required>
        </div>
        <button type="submit" class="btn-primary">Deposit</button>
        <div id="depositMessage" class="message" style="display: none;"></div>
      </form>
    </div>

    <!-- WITHDRAW -->
    <div class="tab-content card" id="tab-withdraw">
      <h2>Withdraw Money</h2>
      <form onsubmit="handleWithdraw(event)">
        <div class="form-group">
          <label for="withdrawAmount">Amount ($)</label>
          <input type="number" id="withdrawAmount" min="0.01" step="0.01" required>
        </div>
        <button type="submit" class="btn-primary">Withdraw</button>
        <div id="withdrawMessage" class="message" style="display: none;"></div>
      </form>
    </div>

    <!-- TRANSFER -->
    <div class="tab-content card" id="tab-transfer">
      <h2>Transfer Funds</h2>
      <form onsubmit="handleTransfer(event)">
        <div class="form-group">
          <label for="transferAccount">Recipient Account Number</label>
          <input type="text" id="transferAccount" required>
        </div>
        <div class="form-group">
          <label for="transferAmount">Amount ($)</label>
          <input type="number" id="transferAmount" min="0.01" step="0.01" required>
        </div>
        <button type="submit" class="btn-primary">Transfer</button>
        <div id="transferMessage" class="message" style="display: none;"></div>
      </form>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/transactions.js"></script>
  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      event.target.classList.add('active');
    }
  </script>
</body>
</html>
